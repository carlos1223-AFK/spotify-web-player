<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Web Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="login" hidden>
    <h1>Spotify Web Player</h1>
    <button id="login-btn">Iniciar sesión con Spotify</button>
    <p class="hint">Requiere Spotify Premium para reproducir en el navegador.</p>
    <p class="hint">Redirect URI a registrar en tu app: <code id="redirect"></code></p>
    <p id="login-error" class="error"></p>
  </section>

  <div id="app" hidden>
    <aside>
      <h2>Tus playlists</h2>
      <ul id="playlists"></ul>
    </aside>
    <main>
      <header>
        <form id="search-form">
          <input id="search-input" type="search" placeholder="Buscar canciones, artistas, álbumes…" autocomplete="off">
        </form>
        <span id="user"></span>
        <button id="logout-btn" class="link">Salir</button>
      </header>
      <p id="status" class="error"></p>
      <div id="results"></div>
    </main>
    <footer id="player">
      <div class="now">
        <img id="cover" alt="" hidden>
        <div><strong id="title">Nada reproduciéndose</strong><br><span id="artist"></span></div>
      </div>
      <div class="controls">
        <div>
          <button id="prev" aria-label="Anterior">⏮</button>
          <button id="toggle" aria-label="Play/Pausa">▶</button>
          <button id="next" aria-label="Siguiente">⏭</button>
        </div>
        <div class="progress">
          <span id="pos">0:00</span>
          <input id="seek" type="range" min="0" max="1" value="0" step="1">
          <span id="dur">0:00</span>
        </div>
      </div>
      <div class="vol"><span>🔊</span><input id="volume" type="range" min="0" max="100" value="50"></div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
